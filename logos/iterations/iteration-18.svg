<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="i18a">
  <title id="i18a">DeepFlow iteration-18: triple-ring iris + three converging beams, lens iris in steel-teal</title>
  <defs>
    <radialGradient id="i18bg" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0%"  stop-color="#1F1F22"/>
      <stop offset="100%" stop-color="#0C0C0D"/>
    </radialGradient>
    <!-- steelTeal iris — single accent locked inside the iris -->
    <radialGradient id="i18iris" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0%"   stop-color="#3E6B82"/>
      <stop offset="62%"  stop-color="#2E5266"/>
      <stop offset="100%" stop-color="#16323F"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#i18bg)"/>

  <g id="signature" transform="translate(256 256)">
    <!-- BEAMS L1 faint -> L3 strong -->
    <path d="M -178 -50 C -120 -22 -80 -10 -56 -4"
          fill="none" stroke="#3F3F46" stroke-width="4"/>
    <circle cx="-178" cy="-50" r="4" fill="#3F3F46"/>

    <path d="M -172 0   C -116 2  -80 2  -56 0"
          fill="none" stroke="#A1A1AA" stroke-width="7"/>
    <circle cx="-172" cy="0" r="4.5" fill="#A1A1AA"/>

    <path d="M -158 50  C -106 18 -80 8  -56 2"
          fill="none" stroke="#FAFAFA" stroke-width="11"/>
    <circle cx="-158" cy="50" r="6" fill="#FAFAFA"/>

    <!-- L3 beam leading edge — steel-teal tip (accent meets the lens) -->
    <circle cx="-56" cy="0" r="3" fill="#2E5266"/>

    <!-- LENS -->
    <circle r="104" fill="none" stroke="#E4E4E7" stroke-width="10"/>
    <!-- IRIS — the only place accent lives -->
    <circle r="64"  fill="url(#i18iris)"/>
    <!-- iris facets -->
    <g stroke="#3E6B82" stroke-width="1.3" opacity="0.55">
      <line x1="0" y1="-64" x2="0" y2="-44"/>
      <line x1="0" y1="-64" x2="0" y2="-44" transform="rotate(45)"/>
      <line x1="0" y1="-64" x2="0" y2="-44" transform="rotate(90)"/>
      <line x1="0" y1="-64" x2="0" y2="-44" transform="rotate(135)"/>
      <line x1="0" y1="-64" x2="0" y2="-44" transform="rotate(225)"/>
      <line x1="0" y1="-64" x2="0" y2="-44" transform="rotate(270)"/>
      <line x1="0" y1="-64" x2="0" y2="-44" transform="rotate(315)"/>
    </g>
    <circle r="44" fill="none" stroke="#16323F" stroke-width="3"/>
    <circle r="28" fill="none" stroke="#52525B" stroke-width="3"/>
    <!-- pupil — the actual black watching point -->
    <circle r="15" fill="#0A0A0A"/>
    <!-- catchlight -->
    <ellipse cx="-5" cy="-6" rx="5" ry="3.5" fill="#FAFAFA" opacity="0.78"/>
    <circle r="2" fill="#FAFAFA"/>
  </g>
</svg>
