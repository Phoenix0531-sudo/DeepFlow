<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="i7a">
  <title id="i7a">DeepFlow iteration-7: zinc sweep slots + hold bar</title>
  <defs>
    <radialGradient id="i7bg" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#18181B"/>
    </radialGradient>
  </defs>

  <!-- 取 iteration-3 思路但在新色板上:
       上半三道递增长度雷达扫描槽 + 瞳里 hold 三段读数条, 全灰度阶进。 -->

  <rect width="512" height="512" rx="112" fill="url(#i7bg)"/>

  <g id="icon" transform="translate(256 256)">
    <circle r="196" fill="none" stroke="#E4E4E7" stroke-width="14"/>

    <!-- 三道扫描槽: 中间最高 + 用色递进 -->
    <rect x="-168" y="-150" width="56" height="36" rx="18" fill="#52525B"/>
    <rect x="-28"  y="-180" width="56" height="60" rx="18" fill="#A1A1AA"/>
    <rect x="112"  y="-150" width="56" height="36" rx="18" fill="#FAFAFA"/>

    <!-- scan beam -->
    <line x1="0" y1="-92" x2="0" y2="-32" stroke="#52525B" stroke-width="10" stroke-linecap="round"/>

    <!-- pupil -->
    <circle r="84" fill="#0A0A0A"/>
    <circle r="84" fill="none" stroke="#3F3F46" stroke-width="8"/>

    <!-- hold bar: 三段, 越右越亮 -->
    <rect x="-44" y="-12" width="88" height="24" rx="12" fill="#1F1F22"/>
    <rect x="-40" y="-8"  width="26" height="16" rx="8" fill="#52525B"/>
    <rect x="-12" y="-8"  width="26" height="16" rx="8" fill="#A1A1AA"/>
    <rect x="16"  y="-8"  width="24" height="16" rx="8" fill="#FAFAFA"/>

    <circle cx="-22" cy="-22" r="10" fill="#E4E4E7" opacity="0.7"/>
  </g>
</svg>
