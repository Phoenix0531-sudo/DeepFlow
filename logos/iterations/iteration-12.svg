<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="i12a">
  <title id="i12a">DeepFlow iteration-12: triple rings + camera crosshair</title>
  <defs>
    <radialGradient id="i12bg" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#18181B"/>
    </radialGradient>
  </defs>

  <!-- iter-6 base, 加 4 道 crosshair 瞄准镜刻度
       上下左右各一段细灰短线 = camera viewfinder 的对焦辅助
       语义: "监督正在锁定你的中心"
       小尺寸下 crosshair 可能略弱, 但仍是 "圆 + 内层圈" 主体 -->

  <rect width="512" height="512" rx="112" fill="url(#i12bg)"/>

  <g id="icon" transform="translate(256 256)">
    <circle r="196" fill="none" stroke="#E4E4E7" stroke-width="14"/>

    <circle r="110" fill="#0A0A0A"/>

    <circle r="98" fill="none" stroke="#52525B" stroke-width="10"/>
    <circle r="78" fill="none" stroke="#A1A1AA" stroke-width="10"/>
    <circle r="56" fill="none" stroke="#FAFAFA" stroke-width="10"/>

    <!-- crosshair 4 ticks, inside pupil area -->
    <g stroke="#E4E4E7" stroke-width="6" stroke-linecap="round" opacity="0.7">
      <line x1="0" y1="-40" x2="0" y2="-26"/>
      <line x1="0" y1="40"  x2="0" y2="26"/>
      <line x1="-40" y1="0" x2="-26" y2="0"/>
      <line x1="40" y1="0"  x2="26" y2="0"/>
    </g>

    <circle r="12" fill="#0A0A0A"/>
    <circle cx="-4" cy="-4" r="5" fill="#E4E4E7" opacity="0.85"/>
  </g>
</svg>
