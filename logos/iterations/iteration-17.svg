<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="i17a">
  <title id="i17a">DeepFlow iteration-17: triple-ring iris + three converging attention beams</title>
  <defs>
    <radialGradient id="i17bg" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0%"  stop-color="#1F1F22"/>
      <stop offset="100%" stop-color="#0C0C0D"/>
    </radialGradient>
    <radialGradient id="i17pupil" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0%"  stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <!--
    iter-17:
      visual thesis = "supervised field".
      Keep the iter-15 watching iris (now the "lens") but add the DeepFlow signature that
      makes it not a generic camera icon: three converging attention beams — L1 faint → L3 strong —
      originating from outside the frame and stopping just short of the iris ring.
      They never breach the lens: the supervisor watches the flow, the flow does not enter the lens.
      This single element encodes the project's actual intervention ladder (L1/L2/L3) into the mark itself.
  -->

  <rect width="512" height="512" rx="112" fill="url(#i17bg)"/>

  <g id="signature" transform="translate(256 256)">
    <!-- BEAMS (outside-in, escalating weight) -->
    <path d="M -178 -50 C -120 -22 -80 -10 -56 -4"
          fill="none" stroke="#3F3F46" stroke-width="4"/>
    <circle cx="-178" cy="-50" r="4" fill="#3F3F46"/>

    <path d="M -172 0   C -116 2  -80 2  -56 0"
          fill="none" stroke="#A1A1AA" stroke-width="7"/>
    <circle cx="-172" cy="0" r="4.5" fill="#A1A1AA"/>

    <path d="M -158 50  C -106 18 -80 8  -56 2"
          fill="none" stroke="#FAFAFA" stroke-width="11"/>
    <circle cx="-158" cy="50" r="6" fill="#FAFAFA"/>

    <!-- IRIS / LENS — the watching eye, kept from iter-15 -->
    <circle r="104" fill="none" stroke="#E4E4E7" stroke-width="10"/>
    <circle r="58"  fill="url(#i17pupil)"/>
    <circle r="78"  fill="none" stroke="#52525B" stroke-width="6"/>
    <circle r="44"  fill="none" stroke="#71717A" stroke-width="6"/>
    <circle r="26"  fill="none" stroke="#E4E4E7" stroke-width="7"/>
    <circle r="15"  fill="#0A0A0A"/>
    <!-- catchlight -->
    <ellipse cx="-6" cy="-7" rx="7" ry="5" fill="#A1A1AA" opacity="0.55"/>
    <circle r="3" fill="#FAFAFA"/>
  </g>
</svg>
