<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="i9a">
  <title id="i9a">DeepFlow iteration-9: smaller pupil + watching highlight</title>
  <defs>
    <radialGradient id="i9bg" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#18181B"/>
    </radialGradient>
  </defs>

  <!-- iter-6 base, 提升"眼神"
       1. 中心实心瞳 r 从 40 缩到 30 (聚焦更尖)
       2. 反光放大到 r=16 + 更高对位偏左上, 反光带一条 8mm 软描边 = 监督当下正滴 = "正在看你"
       3. 隐约一道次反光 (径向对称小亮斑) = 镜头玻璃质感 -->

  <rect width="512" height="512" rx="112" fill="url(#i9bg)"/>

  <g id="icon" transform="translate(256 256)">
    <circle r="196" fill="none" stroke="#E4E4E7" stroke-width="14"/>

    <circle r="110" fill="#0A0A0A"/>

    <circle r="98" fill="none" stroke="#52525B" stroke-width="10"/>
    <circle r="78" fill="none" stroke="#A1A1AA" stroke-width="10"/>
    <circle r="56" fill="none" stroke="#FAFAFA" stroke-width="10"/>

    <!-- smaller, sharper pupil -->
    <circle r="30" fill="#0A0A0A"/>

    <!-- primary highlight, bigger -->
    <path d="M -22 -10 A 22 22 0 0 1 6 -28 A 22 22 0 0 1 -6 -2 Z" fill="#E4E4E7" opacity="0.9"/>
    <!-- secondary tiny glint -->
    <circle cx="10" cy="8" r="4" fill="#E4E4E7" opacity="0.55"/>
  </g>
</svg>
