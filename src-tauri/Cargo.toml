[package]
name = "deepflow"
version = "0.1.1"
description = "DeepFlow — Windows focus lock with whitelist and progressive intervention"
authors = ["DeepFlow"]
edition = "2021"

[lib]
name = "deepflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
once_cell = "1"
# decoding = mjpeg (mozjpeg)；关闭 default 后必须显式打开，否则 MJPEG 解码会报 Not available on WASM
nokhwa = { version = "0.10", default-features = false, features = ["input-msmf", "decoding"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ort = { version = "2.0.0-rc.13", features = ["download-binaries", "ndarray"] }
ndarray = "0.17"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Controls",
  "Win32_Graphics_Dwm",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemServices",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
