<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="flow-title">
  <title id="flow-title">DeepFlow 视觉数据流</title>
  <defs>
    <linearGradient id="f_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F1F22"/>
      <stop offset="100%" stop-color="#161618"/>
    </linearGradient>
    <linearGradient id="f_box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2330"/>
      <stop offset="100%" stop-color="#111824"/>
    </linearGradient>
    <marker id="fArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/>
    </marker>
  </defs>

  <rect width="1200" height="360" fill="url(#f_bg)"/>

  <text x="600" y="40" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Arial"
        font-size="22" font-weight="700" fill="#E2E8F0">视觉数据流</text>
  <text x="600" y="62" text-anchor="middle" font-family="ui-sans-serif,system-ui,Segoe UI,Arial"
        font-size="13" fill="#64748B">摄像头帧 → ONNX 推理 → 滑窗墙钟持屏 → FSM 决策 → SQLite 日志</text>

  <!-- pipeline boxes, centered vertical line -->
  <g font-family="ui-sans-serif,system-ui,Segoe UI,Arial" font-size="13" fill="#E2E8F0">
    <!-- 1 camera -->
    <g transform="translate(60 130)">
      <rect width="190" height="100" rx="14" fill="url(#f_box)" stroke="#A1A1AA" stroke-opacity="0.5"/>
      <text x="14" y="28" font-size="11" font-weight="700" fill="#A1A1AA">① 输入</text>
      <text x="14" y="54" font-size="14" font-weight="700">摄像头帧</text>
      <text x="14" y="78" font-size="11.5" fill="#94A3B8">camera_stream.rs</text>
      <text x="14" y="94" font-size="11" fill="#64748B">MediaStream + src id</text>
    </g>
    <!-- 2 ONNX -->
    <g transform="translate(290 130)">
      <rect width="200" height="100" rx="14" fill="url(#f_box)" stroke="#E4E4E7" stroke-opacity="0.5"/>
      <text x="14" y="28" font-size="11" font-weight="700" fill="#E4E4E7">② 推理</text>
      <text x="14" y="54" font-size="14" font-weight="700">yolo11n ONNX</text>
      <text x="14" y="78" font-size="11.5" fill="#94A3B8">vision/pipeline · detector</text>
      <text x="14" y="94" font-size="11" fill="#64748B">CPU/GPU 可切(prefer_cpu)</text>
    </g>
    <!-- 3 sliding window -->
    <g transform="translate(530 130)">
      <rect width="200" height="100" rx="14" fill="url(#f_box)" stroke="#52525B" stroke-opacity="0.5"/>
      <text x="14" y="28" font-size="11" font-weight="700" fill="#52525B">③ 持屏判定</text>
      <text x="14" y="54" font-size="14" font-weight="700">滑窗墙钟 hold</text>
      <text x="14" y="78" font-size="11.5" fill="#94A3B8">sliding_window.rs</text>
      <text x="14" y="94" font-size="11" fill="#64748B">独立于 fps · 释放复位</text>
    </g>
    <!-- 4 FSM -->
    <g transform="translate(770 130)">
      <rect width="200" height="100" rx="14" fill="url(#f_box)" stroke="#A1A1AA" stroke-opacity="0.55"/>
      <text x="14" y="28" font-size="11" font-weight="700" fill="#A1A1AA">④ 决策</text>
      <text x="14" y="54" font-size="14" font-weight="700">SystemFSM</text>
      <text x="14" y="78" font-size="11.5" fill="#94A3B8">fsm/machine.rs</text>
      <text x="14" y="94" font-size="11" fill="#64748B">L1/L2/L3 状态迁移</text>
    </g>
    <!-- 5 DB -->
    <g transform="translate(1010 130)">
      <rect width="130" height="100" rx="14" fill="url(#f_box)" stroke="#52525B" stroke-opacity="0.55"/>
      <text x="14" y="28" font-size="11" font-weight="700" fill="#52525B">⑤ 落库</text>
      <text x="14" y="54" font-size="14" font-weight="700">SQLite</text>
      <text x="14" y="78" font-size="11.5" fill="#94A3B8">db/logger.rs</text>
      <text x="14" y="94" font-size="11" fill="#64748B">focus_logs 表</text>
    </g>
  </g>

  <!-- arrows -->
  <g stroke="#A1A1AA" stroke-width="2" fill="none" marker-end="url(#fArr)">
    <line x1="252" y1="180" x2="286" y2="180"/>
    <line x1="492" y1="180" x2="526" y2="180"/>
    <line x1="732" y1="180" x2="766" y2="180"/>
    <line x1="972" y1="180" x2="1006" y2="180"/>
  </g>

  <!-- emit branch -->
  <g transform="translate(770 270)">
    <rect width="200" height="40" rx="8" fill="#1F1F22" stroke="#3730A3"/>
    <text x="14" y="26" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="#FAFAFA">app.emit(INTERVENTION_LV3)</text>
  </g>
  <g stroke="#3730A3" stroke-width="2" fill="none" stroke-dasharray="4 4" marker-end="url(#fArr)">
    <defs><marker id="fArrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E4E4E7"/></marker></defs>
    <line x1="870" y1="232" x2="870" y2="268" stroke="#E4E4E7"/>
  </g>

  <!-- heuristic fallback -->
  <g transform="translate(290 270)">
    <rect width="200" height="40" rx="8" fill="#1F1F22" stroke="#64748B" stroke-opacity="0.55"/>
    <text x="14" y="26" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="#94A3B8">无 ONNX → 启发式检测器兜底</text>
  </g>
  <g stroke="#64748B" stroke-width="2" fill="none" stroke-dasharray="4 4">
    <line x1="390" y1="232" x2="390" y2="268" marker-end="url(#fArrP)" stroke="#94A3B8"/>
  </g>
</svg>
