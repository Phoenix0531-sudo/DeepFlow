<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" role="img" aria-labelledby="h-title">
  <title id="h-title">DeepFlow — local Windows focus supervisor</title>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0%"  stop-color="#1F1F22"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </radialGradient>
    <radialGradient id="pupil" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0%"  stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <!-- A. canvas -->
  <rect width="1600" height="480" fill="url(#bg)"/>

  <!-- B. hairline rule top — the page's lower edge of the badge row -->
  <line x1="80" y1="64" x2="1520" y2="64" stroke="#27272A" stroke-width="1"/>

  <!-- C. the SIGNATURE — supervised field. Three attention beams (L1 faint → L3 strong)
       converge onto a watching lens. This is the project's whole idea in one picture. -->
  <g id="signature" transform="translate(440 250)">
    <!-- beam L1: far-left, faintest -->
    <path d="M -380 -40 C -250 -8 -140 -4 -80 0"
          fill="none" stroke="#3F3F46" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-380" cy="-40" r="3" fill="#3F3F46"/>
    <!-- beam L2: mid-left -->
    <path d="M -360 0   C -240 3  -150 2  -84 0"
          fill="none" stroke="#A1A1AA" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-360" cy="0" r="3.5" fill="#A1A1AA"/>
    <!-- beam L3: nearest, brightest — the strongest nudge -->
    <path d="M -340 40  C -230 14 -150 6  -84 0"
          fill="none" stroke="#FAFAFA" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-340" cy="40" r="4.5" fill="#FAFAFA"/>

    <!-- the watching lens — triple-ring iris + dark pupil + one sharp catchlight -->
    <circle r="142" fill="none" stroke="#E4E4E7" stroke-width="6"/>
    <circle r="72"  fill="url(#pupil)"/>
    <circle r="86"  fill="none" stroke="#52525B" stroke-width="5"/>
    <circle r="56"  fill="none" stroke="#71717A" stroke-width="5"/>
    <circle r="34"  fill="none" stroke="#E4E4E7" stroke-width="6"/>
    <circle r="18"  fill="#0A0A0A"/>
    <ellipse cx="-7" cy="-8" rx="9" ry="6" fill="#A1A1AA" opacity="0.5"/>
    <circle r="3.5" fill="#FAFAFA"/>

    <!-- the beams stop just at the ring — never enter the lens; the supervisor watches the flow, not the other way around. -->
  </g>

  <!-- D. wordmark — restrained, no faux-3D, no glow -->
  <g id="wordmark" transform="translate(780 196)">
    <text font-family="ui-sans-serif, system-ui, Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="92" font-weight="800" fill="#FAFAFA" letter-spacing="-3">DeepFlow</text>
    <text y="58" font-family="ui-sans-serif, system-ui, Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="24" fill="#A1A1AA" letter-spacing="0">监督镜头 · 视觉三级闯入 · 本地 Rust</text>
    <text y="92" font-family="ui-sans-serif, system-ui, Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="22" fill="#71717A">A Windows supervisor that reads the room and lifts attention back.</text>
  </g>

  <!-- E. quantitative spine — structural facts, not marketing chips. Each row is one real true/false about the binary. -->
  <g id="facts" transform="translate(780 332)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="0"   y="0" fill="#52525B">account ……… 0</text>
    <text x="220" y="0" fill="#52525B">cloud ……… 0</text>
    <text x="430" y="0" fill="#52525B">telemetry … 0</text>
    <text x="0"   y="26" fill="#A1A1AA">windows rims …  5</text>
    <text x="220" y="26" fill="#A1A1AA">ipc commands … 22</text>
    <text x="430" y="26" fill="#A1A1AA">tests passed …  72/72</text>
  </g>

  <!-- F. footer rule + version tag, the one quiet brand mark -->
  <line x1="80" y1="416" x2="1520" y2="416" stroke="#27272A" stroke-width="1"/>
  <text x="80" y="444" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" font-weight="600" fill="#A1A1AA">0.1.0</text>
  <text x="142" y="444" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#3F3F46">—MIT licensed, single-binary Windows app —</text>
  <text x="1520" y="444" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#3F3F46">build · tauri 2 / rust / react 19 / onnx</text>
</svg>
