<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="h-title">
  <title id="h-title">DeepFlow — local Windows focus supervisor</title>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0%"   stop-color="#1F1F22"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </radialGradient>
    <!-- lens iris fill: steel-teal — the single accent, locked inside the iris ring -->
    <radialGradient id="iris" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0%"   stop-color="#3E6B82"/>
      <stop offset="62%"  stop-color="#2E5266"/>
      <stop offset="100%" stop-color="#16323F"/>
    </radialGradient>
  </defs>

  <!-- A. canvas -->
  <rect width="1600" height="500" fill="url(#bg)"/>

  <!-- B. top hairline — the eyebrow rule -->
  <line x1="80" y1="68" x2="1520" y2="68" stroke="#27272A" stroke-width="1"/>
  <text x="80" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13" font-weight="600" fill="#71717A" letter-spacing="3">DEEPFLOW · v0.1.0</text>
  <text x="1520" y="50" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13" fill="#71717A">windows / rust / react / onnx</text>

  <!-- C. SIGNATURE — supervised field -->
  <g id="signature" transform="translate(440 250)">
    <!-- BEAMS: L1 faintest → L3 brightest; they stop a few px short of the ring, never enter the lens -->
    <path d="M -380 -44 C -250 -10 -140 -4 -86 0"
          fill="none" stroke="#3F3F46" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-380" cy="-44" r="3" fill="#3F3F46"/>

    <path d="M -360 0 C -244 3 -150 2 -86 0"
          fill="none" stroke="#A1A1AA" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-360" cy="0" r="3.5" fill="#A1A1AA"/>

    <path d="M -344 44 C -232 14 -150 6 -86 0"
          fill="none" stroke="#FAFAFA" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-344" cy="44" r="4.5" fill="#FAFAFA"/>

    <!-- the LEADING edge of the L3 beam carries a 4px steel-teal tip — it's the accent, marking the moment attention is about to hit the lens -->
    <circle cx="-86" cy="0" r="5" fill="#2E5266"/>

    <!-- LENS / IRIS -->
    <circle r="142" fill="none" stroke="#E4E4E7" stroke-width="5"/>
    <circle r="84"  fill="url(#iris)"/>
    <!-- iris facets: thin radial lines -->
    <g stroke="#3E6B82" stroke-width="1.2" opacity="0.55">
      <line x1="0" y1="-84" x2="0" y2="-58"/>
      <line x1="0" y1="58"  x2="0" y2="84" transform="rotate(180)"/>
      <line x1="0" y1="-84" x2="0" y2="-58" transform="rotate(45)"/>
      <line x1="0" y1="-84" x2="0" y2="-58" transform="rotate(90)"/>
      <line x1="0" y1="-84" x2="0" y2="-58" transform="rotate(135)"/>
      <line x1="0" y1="-84" x2="0" y2="-58" transform="rotate(225)"/>
      <line x1="0" y1="-84" x2="0" y2="-58" transform="rotate(270)"/>
      <line x1="0" y1="-84" x2="0" y2="-58" transform="rotate(315)"/>
    </g>
    <!-- 3 supervision rings inside iris, still zinc, stepping toward darker pupil -->
    <circle r="58" fill="none" stroke="#16323F" stroke-width="4"/>
    <circle r="38" fill="none" stroke="#52525B" stroke-width="3"/>
    <!-- pupil — the actual black point that "watches" -->
    <circle r="20" fill="#0A0A0A"/>
    <!-- one sharp catchlight on upper-left of pupil -->
    <ellipse cx="-7" cy="-8" rx="6" ry="4" fill="#FAFAFA" opacity="0.75"/>
    <circle r="2.4" fill="#FAFAFA"/>
  </g>

  <!-- D. wordmark — restrained -->
  <g id="wordmark" transform="translate(780 196)">
    <text font-family="ui-sans-serif, system-ui, Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="92" font-weight="800" fill="#FAFAFA" letter-spacing="-3">DeepFlow</text>
    <text y="54" font-family="ui-sans-serif, system-ui, Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="24" fill="#A1A1AA">本地监督镜头 ·视觉三级递进· 不上传一字节</text>
    <text y="86" font-family="ui-sans-serif, system-ui, Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="22" fill="#71717A">摄像头看出刷机姿势 → L1 提示 · L2 主屏遮罩 · L3 锁屏　门口拦截。</text>
  </g>

  <!-- E. horizon line + spine — structural fact line (one quiet blue ribbon binds the metrics) -->
  <line x1="780" y1="306" x2="1520" y2="306" stroke="#2E5266" stroke-width="1" opacity="0.55"/>

  <g id="facts" transform="translate(780 332)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="0"   y="0" fill="#71717A">account   = 0</text>
    <text x="180" y="0" fill="#71717A">cloud     = 0</text>
    <text x="360" y="0" fill="#71717A">telemetry = 0</text>
    <text x="540" y="0" fill="#71717A">endpoint  = (production https)</text>
    <text x="0"   y="26" fill="#A1A1AA">windows rims  = 5</text>
    <text x="180" y="26" fill="#A1A1AA">ipc commands  = 22</text>
    <text x="360" y="26" fill="#A1A1AA">focus events  = full</text>
    <text x="540" y="26" fill="#A1A1AA">tests passed  = 72 / 72</text>
  </g>

  <!-- F. footer rule + meta -->
  <line x1="80" y1="432" x2="1520" y2="432" stroke="#27272A" stroke-width="1"/>
  <text x="80" y="460" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" font-weight="600" fill="#A1A1AA">0.1.0</text>
  <text x="142" y="460" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#3F3F46">— MIT licensed, single-binary Windows app</text>
  <text x="1520" y="460" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#52525B">build · tauri 2 / rust / react 19 / onnx</text>
</svg>
