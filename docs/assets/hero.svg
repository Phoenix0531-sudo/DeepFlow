<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="hero-title">
  <title id="hero-title">DeepFlow - Windows 本地端专注澹泊器</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="55%" stop-color="#0F1620"/>
      <stop offset="100%" stop-color="#10131C"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="chipBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2230"/>
      <stop offset="100%" stop-color="#0F1620"/>
    </linearGradient>
    <linearGradient id="logoMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- Subtle grid (thin) -->
  <g stroke="#1C2330" stroke-width="1" opacity="0.7">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
  </g>

  <!-- accent halo behind logo area -->
  <circle cx="170" cy="160" r="92" fill="#7DD3FC" opacity="0.10" filter="url(#soft)"/>

  <!-- Logo mark: layered horizontal flow bars -->
  <g transform="translate(170 160)">
    <rect x="-50" y="-46" width="100" height="14" rx="7" fill="url(#logoMark)"/>
    <rect x="-50" y="-23" width="80" height="14" rx="7" fill="#7DD3FC" opacity="0.65"/>
    <rect x="-50" y="0" width="100" height="14" rx="7" fill="url(#logoMark)"/>
    <rect x="-50" y="23" width="64" height="14" rx="7" fill="#A78BFA" opacity="0.65"/>
    <rect x="-50" y="46" width="44" height="14" rx="7" fill="#A78BFA" opacity="0.45"/>
  </g>

  <!-- Title -->
  <text x="310" y="118" font-family="ui-sans-serif,system-ui,Segoe UI,Inter,Arial,sans-serif"
        font-size="64" font-weight="800" fill="#F1F5F9" letter-spacing="-1">
    DeepFlow
  </text>

  <!-- Tagline -->
  <text x="312" y="160" font-family="ui-sans-serif,system-ui,Segoe UI,Inter,Arial,sans-serif"
        font-size="22" fill="#94A3B8">
    本地端、零云端、视觉辅助的 Windows 专注澹泊器
  </text>

  <!-- long accent line -->
  <rect x="310" y="180" width="270" height="3" rx="1.5" fill="url(#accentLine)"/>

  <!-- meta line -->
  <text x="310" y="208" font-family="ui-sans-serif,system-ui,Segoe UI,Inter,Arial,sans-serif"
        font-size="15" fill="#CBD5E1">
    Tauri 2 · React 19 · Rust · ONNX 视觉 · SQLite 本地存储
  </text>

  <!-- Feature chips -->
  <g font-family="ui-sans-serif,system-ui,Segoe UI,Inter,Arial,sans-serif" font-size="14" font-weight="600">
    <g transform="translate(310 232)">
      <rect width="180" height="40" rx="20" fill="url(#chipBg)" stroke="#7DD3FC" stroke-opacity="0.55"/>
      <circle cx="20" cy="20" r="5" fill="#7DD3FC"/>
      <text x="36" y="25" fill="#E2E8F0">主屏遮罩 + 进程白名单</text>
    </g>
    <g transform="translate(500 232)">
      <rect width="180" height="40" rx="20" fill="url(#chipBg)" stroke="#A78BFA" stroke-opacity="0.55"/>
      <circle cx="20" cy="20" r="5" fill="#A78BFA"/>
      <text x="36" y="25" fill="#E2E8F0">休息债务 + 渐进干预</text>
    </g>
    <g transform="translate(690 232)">
      <rect width="180" height="40" rx="20" fill="url(#chipBg)" stroke="#10B981" stroke-opacity="0.55"/>
      <circle cx="20" cy="20" r="5" fill="#10B981"/>
      <text x="36" y="25" fill="#E2E8F0">摄像头 + L1-L3 三阶闯入</text>
    </g>
  </g>

  <!-- corner watermark -->
  <text x="1160" y="300" text-anchor="end" font-family="ui-monospace,Menlo,monospace"
        font-size="11" fill="#475569">v0.1.0 · MIT</text>
</svg>
