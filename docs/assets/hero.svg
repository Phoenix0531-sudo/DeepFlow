<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="hero-title">
  <title id="hero-title">DeepFlow — Windows 本地端专注澹泊器</title>
  <defs>
    <radialGradient id="h_bg" cx="0.5" cy="0.5" r="0.9">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#161618"/>
    </radialGradient>
    <radialGradient id="h_pupil" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#h_bg)"/>

  <!-- subtle grid -->
  <g stroke="#1F1F22" stroke-width="1" opacity="0.9">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
  </g>

  <!-- LOGO MARK: selected iteration-15 (zinc triple-ring + crescent) -->
  <g transform="translate(160 160) scale(1.05)">
    <circle r="92" fill="none" stroke="#E4E4E7" stroke-width="8"/>
    <circle r="52" fill="url(#h_pupil)"/>
    <circle r="46" fill="none" stroke="#52525B" stroke-width="5"/>
    <circle r="36" fill="none" stroke="#A1A1AA" stroke-width="5"/>
    <circle r="26" fill="none" stroke="#FAFAFA" stroke-width="5"/>
    <circle r="17" fill="#0A0A0A"/>
    <ellipse cx="-5" cy="-6" rx="6" ry="4" fill="#A1A1AA" opacity="0.55"/>
    <circle r="2.3" fill="#FAFAFA"/>
  </g>

  <!-- WORDMARK -->
  <text x="298" y="118" font-family="ui-sans-serif,system-ui,Segoe UI,Inter,Arial,sans-serif"
        font-size="64" font-weight="800" fill="#FAFAFA" letter-spacing="-1">
    DeepFlow
  </text>

  <text x="300" y="160" font-family="ui-sans-serif,system-ui,Segoe UI,Inter,Arial,sans-serif"
        font-size="22" fill="#A1A1AA">
    本地端 · 零云端 · 视觉辅助的 Windows 专注澹泊器
  </text>

  <!-- palette strip — proof we used the zinc family, not AI defaults -->
  <g transform="translate(300 188)">
    <rect width="14" height="14" rx="2" fill="#18181B"/><rect x="20" width="14" height="14" rx="2" fill="#27272A"/>
    <rect x="40" width="14" height="14" rx="2" fill="#52525B"/><rect x="60" width="14" height="14" rx="2" fill="#71717A"/>
    <rect x="80" width="14" height="14" rx="2" fill="#A1A1AA"/><rect x="100" width="14" height="14" rx="2" fill="#E4E4E7"/>
    <rect x="120" width="14" height="14" rx="2" fill="#FAFAFA"/>
    <text x="148" y="11" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#71717A">zinc 黑灰冷峻族</text>
  </g>

  <!-- meta -->
  <text x="300" y="226" font-family="ui-sans-serif,system-ui,Segoe UI,Inter,Arial,sans-serif"
        font-size="14" fill="#E4E4E7">
    Tauri 2 · React 19 · Rust · ONNX 视觉 · SQLite 本地存储
  </text>

  <!-- chips -->
  <g font-family="ui-sans-serif,system-ui,Segoe UI,Inter,Arial,sans-serif" font-size="13" font-weight="600">
    <g transform="translate(300 246)">
      <rect width="196" height="32" rx="16" fill="#27272A" stroke="#3F3F46"/>
      <rect x="6" y="6" width="20" height="20" rx="10" fill="none" stroke="#71717A" stroke-width="2"/>
      <circle cx="16" cy="16" r="3" fill="#FAFAFA"/>
      <text x="36" y="21" fill="#E4E4E7">监督镜头 + L1/L2/L3 递进</text>
    </g>
    <g transform="translate(512 246)">
      <rect width="180" height="32" rx="16" fill="#27272A" stroke="#3F3F46"/>
      <rect x="6" y="8" width="6" height="16" rx="3" fill="#52525B"/>
      <rect x="16" y="4" width="6" height="20" rx="3" fill="#A1A1AA"/>
      <rect x="26" y="2" width="6" height="22" rx="3" fill="#FAFAFA"/>
      <text x="46" y="21" fill="#E4E4E7">休息债务 + 平衡</text>
    </g>
    <g transform="translate(712 246)">
      <rect width="212" height="32" rx="16" fill="#27272A" stroke="#3F3F46"/>
      <rect x="10" y="14" width="32" height="4" rx="2" fill="#52525B"/>
      <rect x="10" y="14" width="20" height="4" rx="2" fill="#FAFAFA"/>
      <text x="56" y="21" fill="#E4E4E7">主屏遮罩 + 进程白名单</text>
    </g>
  </g>

  <!-- corner watermark -->
  <text x="1180" y="304" text-anchor="end" font-family="ui-monospace,Menlo,monospace"
        font-size="10" fill="#3F3F46">v0.1.0 · MIT</text>
</svg>
