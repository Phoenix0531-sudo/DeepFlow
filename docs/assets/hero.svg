<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="h-title h-desc">
  <title id="h-title">DeepFlow — local Windows focus supervisor</title>
  <desc id="h-desc">Project name beside a watching lens with three converging attention beams (L1 dim to L3 bright).</desc>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0%"   stop-color="#1F1F22"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0%"   stop-color="#3E6B82"/>
      <stop offset="62%"  stop-color="#2E5266"/>
      <stop offset="100%" stop-color="#16323F"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- LENS + three attention beams -->
  <g id="signature" transform="translate(220 140)">
    <!-- L1 dim, faintest -->
    <path d="M -230 -32 C -150 -8 -86 -3 -52 0"
          fill="none" stroke="#3F3F46" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-230" cy="-32" r="3" fill="#3F3F46"/>
    <!-- L2 mid -->
    <path d="M -218 0 C -144 2 -86 2 -52 0"
          fill="none" stroke="#A1A1AA" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="-218" cy="0" r="3.5" fill="#A1A1AA"/>
    <!-- L3 bright -->
    <path d="M -206 32 C -134 10 -86 4 -52 0"
          fill="none" stroke="#FAFAFA" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-206" cy="32" r="4.5" fill="#FAFAFA"/>
    <!-- accent tip — steel-teal circle where the beam meets the lens -->
    <circle cx="-52" cy="0" r="6" fill="#2E5266"/>

    <!-- LENS -->
    <circle r="80" fill="none" stroke="#E4E4E7" stroke-width="5"/>
    <circle r="48" fill="url(#iris)"/>
    <g stroke="#3E6B82" stroke-width="1.2" opacity="0.55">
      <line x1="0" y1="-48" x2="0" y2="-34"/>
      <line x1="0" y1="-48" x2="0" y2="-34" transform="rotate(45)"/>
      <line x1="0" y1="-48" x2="0" y2="-34" transform="rotate(90)"/>
      <line x1="0" y1="-48" x2="0" y2="-34" transform="rotate(135)"/>
      <line x1="0" y1="-48" x2="0" y2="-34" transform="rotate(225)"/>
      <line x1="0" y1="-48" x2="0" y2="-34" transform="rotate(270)"/>
      <line x1="0" y1="-48" x2="0" y2="-34" transform="rotate(315)"/>
    </g>
    <circle r="34" fill="none" stroke="#16323F" stroke-width="3"/>
    <circle r="22" fill="none" stroke="#52525B" stroke-width="2.5"/>
    <!-- pupil -->
    <circle r="12" fill="#0A0A0A"/>
    <ellipse cx="-4.5" cy="-5.5" rx="4.5" ry="3" fill="#FAFAFA" opacity="0.78"/>
    <circle r="1.8" fill="#FAFAFA"/>
  </g>

  <!-- wordmark + single English tagline -->
  <g id="wordmark" transform="translate(400 135)">
    <text font-family="ui-sans-serif, system-ui, Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="64" font-weight="800" fill="#FAFAFA" letter-spacing="-2">DeepFlow</text>
    <text y="44" font-family="ui-sans-serif, system-ui, Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="18" fill="#A1A1AA">A local Windows focus supervisor — three graduated interventions, zero telemetry.</text>
  </g>
</svg>
