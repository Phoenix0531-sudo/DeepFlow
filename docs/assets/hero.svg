<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="h-title h-desc">
  <title id="h-title">DeepFlow — local Windows focus supervisor</title>
  <desc id="h-desc">A triple-ring iris watched by three converging attention beams (L1 dim to L3 bright), paired with the project name and a single-row metric spine.</desc>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0%"   stop-color="#1F1F22"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0%"   stop-color="#3E6B82"/>
      <stop offset="62%"  stop-color="#2E5266"/>
      <stop offset="100%" stop-color="#16323F"/>
    </radialGradient>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- top eyebrow rule + meta -->
  <line x1="64" y1="58" x2="1136" y2="58" stroke="#27272A" stroke-width="1"/>
  <text x="64" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" font-weight="600" fill="#71717A" letter-spacing="3">DEEPFLOW · v0.1.0</text>
  <text x="1136" y="42" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#71717A">windows / rust / react / onnx</text>

  <!-- SIGNATURE — supervised field -->
  <g id="signature" transform="translate(330 215)">
    <!-- L1 dim, faintest -->
    <path d="M -280 -32 C -190 -8 -100 -3 -62 0"
          fill="none" stroke="#3F3F46" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-280" cy="-32" r="3" fill="#3F3F46"/>
    <!-- L2 mid -->
    <path d="M -268 0 C -180 2  -112 2  -62 0"
          fill="none" stroke="#A1A1AA" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="-268" cy="0" r="3.5" fill="#A1A1AA"/>
    <!-- L3 bright -->
    <path d="M -256 32 C -172 10 -112 4  -62 0"
          fill="none" stroke="#FAFAFA" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-256" cy="32" r="4.5" fill="#FAFAFA"/>
    <!-- accent tip — steel-teal circle where the beam meets the lens -->
    <circle cx="-62" cy="0" r="6" fill="#2E5266"/>

    <!-- LENS -->
    <circle r="116" fill="none" stroke="#E4E4E7" stroke-width="6"/>
    <circle r="68"  fill="url(#iris)"/>
    <g stroke="#3E6B82" stroke-width="1.4" opacity="0.55">
      <line x1="0" y1="-68" x2="0" y2="-48"/>
      <line x1="0" y1="-68" x2="0" y2="-48" transform="rotate(45)"/>
      <line x1="0" y1="-68" x2="0" y2="-48" transform="rotate(90)"/>
      <line x1="0" y1="-68" x2="0" y2="-48" transform="rotate(135)"/>
      <line x1="0" y1="-68" x2="0" y2="-48" transform="rotate(225)"/>
      <line x1="0" y1="-68" x2="0" y2="-48" transform="rotate(270)"/>
      <line x1="0" y1="-68" x2="0" y2="-48" transform="rotate(315)"/>
    </g>
    <circle r="48" fill="none" stroke="#16323F" stroke-width="4"/>
    <circle r="32" fill="none" stroke="#52525B" stroke-width="3"/>
    <!-- pupil — the actual watching point -->
    <circle r="17" fill="#0A0A0A"/>
    <ellipse cx="-6" cy="-7" rx="6" ry="4" fill="#FAFAFA" opacity="0.78"/>
    <circle r="2.4" fill="#FAFAFA"/>
  </g>

  <!-- wordmark + tagline -->
  <g id="wordmark" transform="translate(600 168)">
    <text font-family="ui-sans-serif, system-ui, Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="76" font-weight="800" fill="#FAFAFA" letter-spacing="-2">DeepFlow</text>
    <text y="46" font-family="ui-sans-serif, system-ui, Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="24" fill="#A1A1AA">本地监督镜头 ·视觉三级递进· 不上传一字节</text>
    <text y="80" font-family="ui-sans-serif, system-ui, Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="24" fill="#71717A">摄像头看出刷机姿势 → L1 提示 · L2 主屏遮罩 · L3 锁屏。</text>
  </g>

  <!-- horizon hairline (accent, dim) — the spine of the fact row below -->
  <line x1="600" y1="280" x2="1136" y2="280" stroke="#2E5266" stroke-width="1" opacity="0.55"/>

  <!-- fact spine — larger for 900px readability -->
  <g id="facts" transform="translate(600 312)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <text x="0"   y="0"  fill="#71717A">account=0</text>
    <text x="130" y="0"  fill="#71717A">cloud=0</text>
    <text x="260" y="0"  fill="#71717A">telemetry=0</text>
    <text x="400" y="0"  fill="#71717A">endpoint=https</text>
    <text x="0"   y="28" fill="#A1A1AA">win=5</text>
    <text x="130" y="28" fill="#A1A1AA">ipc=22</text>
    <text x="260" y="28" fill="#A1A1AA">events=full</text>
    <text x="400" y="28" fill="#A1A1AA">tests=77/77</text>
  </g>

  <!-- footer rule + meta -->
  <line x1="64" y1="372" x2="1136" y2="372" stroke="#27272A" stroke-width="1"/>
  <text x="64" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" font-weight="600" fill="#A1A1AA">0.1.0</text>
  <text x="126" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#3F3F46">— MIT licensed · single-binary Windows app</text>
  <text x="1136" y="398" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#52525B">build · tauri 2 / rust / react 19 / onnx</text>
</svg>
