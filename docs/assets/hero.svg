<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="h-title h-desc">
  <title id="h-title">DeepFlow — local Windows focus supervisor</title>
  <desc id="h-desc">Project name beside a watching lens with three converging attention beams (L1 dim to L3 bright).</desc>
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0%"   stop-color="#1F1F22"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0%"   stop-color="#3E6B82"/>
      <stop offset="62%"  stop-color="#2E5266"/>
      <stop offset="100%" stop-color="#16323F"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- LENS + three attention beams -->
  <g id="signature" transform="translate(240 160)">
    <!-- L1 dim, faintest -->
    <path d="M -240 -32 C -160 -8 -90 -3 -55 0"
          fill="none" stroke="#3F3F46" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-240" cy="-32" r="3" fill="#3F3F46"/>
    <!-- L2 mid -->
    <path d="M -228 0 C -150 2 -90 2 -55 0"
          fill="none" stroke="#A1A1AA" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="-228" cy="0" r="3.5" fill="#A1A1AA"/>
    <!-- L3 bright -->
    <path d="M -216 32 C -140 10 -90 4 -55 0"
          fill="none" stroke="#FAFAFA" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-216" cy="32" r="4.5" fill="#FAFAFA"/>
    <!-- accent tip — steel-teal circle where the beam meets the lens -->
    <circle cx="-55" cy="0" r="6" fill="#2E5266"/>

    <!-- LENS -->
    <circle r="92" fill="none" stroke="#E4E4E7" stroke-width="5"/>
    <circle r="54" fill="url(#iris)"/>
    <g stroke="#3E6B82" stroke-width="1.2" opacity="0.55">
      <line x1="0" y1="-54" x2="0" y2="-38"/>
      <line x1="0" y1="-54" x2="0" y2="-38" transform="rotate(45)"/>
      <line x1="0" y1="-54" x2="0" y2="-38" transform="rotate(90)"/>
      <line x1="0" y1="-54" x2="0" y2="-38" transform="rotate(135)"/>
      <line x1="0" y1="-54" x2="0" y2="-38" transform="rotate(225)"/>
      <line x1="0" y1="-54" x2="0" y2="-38" transform="rotate(270)"/>
      <line x1="0" y1="-54" x2="0" y2="-38" transform="rotate(315)"/>
    </g>
    <circle r="38" fill="none" stroke="#16323F" stroke-width="3"/>
    <circle r="25" fill="none" stroke="#52525B" stroke-width="2.5"/>
    <!-- pupil -->
    <circle r="14" fill="#0A0A0A"/>
    <ellipse cx="-5" cy="-6" rx="5" ry="3.5" fill="#FAFAFA" opacity="0.78"/>
    <circle r="2" fill="#FAFAFA"/>
  </g>

  <!-- wordmark + two-line tagline (zh / en) -->
  <g id="wordmark" transform="translate(420 145)">
    <text font-family="ui-sans-serif, system-ui, Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="68" font-weight="800" fill="#FAFAFA" letter-spacing="-2">DeepFlow</text>
    <text y="56" font-family="ui-sans-serif, system-ui, Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="22" fill="#A1A1AA">本地监督镜头 · 视觉三级递进 · 不上传一字节</text>
    <text y="92" font-family="ui-sans-serif, system-ui, Segoe UI, Inter, Helvetica, Arial, sans-serif"
          font-size="16" fill="#71717A" letter-spacing="0.5">A local Windows focus supervisor — camera watches your posture, three graduated interventions pull attention back.</text>
  </g>
</svg>
